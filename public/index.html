<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Under Maintenance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            padding: 70px 40px;
            text-align: center;
            animation: cardIn 0.8s ease-out;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrap {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        h1 {
            color: #ffffff;
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #a8b8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .divider {
            height: 3px;
            width: 80px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 0 auto 30px;
            border-radius: 3px;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.6);
        }

        .main-msg {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .sub-msg {
            color: #b8b8d0;
            font-size: 15px;
            line-height: 1.7;
        }

        @media (max-width: 480px) {
            .card { padding: 50px 25px; }
            h1 { font-size: 32px; }
            .main-msg { font-size: 20px; }
            .icon-wrap { width: 100px; height: 100px; font-size: 50px; }
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="icon-wrap">🤖</div>

        <h1>Bot Under Maintenance</h1>

        <div class="divider"></div>

        <p class="main-msg">Please Wait 1-2 Hours ⏳</p>

        <p class="sub-msg">
            Bot is down for a short while right now.<br>
            Some updates are in progress. Please come back in a little while,<br>
            the bot will be fixed soon!
        </p>

    </div>

</body>
</html>
